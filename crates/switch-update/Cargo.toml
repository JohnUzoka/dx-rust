[package]
name = "switch-update"
description = "DX RUST's over-the-air updates on the Nintendo Switch: its GitHub releases, checked and put in the running NRO's place"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

[features]
# Links the system's libcurl, so checks and downloads also run on a PC (examples/check.rs). The Switch build
# always links devkitPro's switch-curl (build.rs).
system-curl = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.28"
sha2 = { version = "0.10.9", default-features = false }

[[example]]
name = "check"
required-features = ["system-curl"]
