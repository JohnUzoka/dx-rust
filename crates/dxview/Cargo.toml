[package]
name = "dxview"
license = "GPL-3.0-or-later"
edition.workspace = true
version.workspace = true

[build-dependencies]
winresource = "0.1"

[dependencies]
bevy = { version = "0.19.1", default-features = false }
# The GPU timer's query sets and buffers (horizon/gpu_frame_time.rs) name wgpu types; bevy's version, default features off.
wgpu = { version = "29.0.4", default-features = false }
dx-level = { path = "../dx-level" }
imsim-core = { path = "../imsim-core" }
unreal-pkg = { path = "../unreal-pkg" }
imsim-audio = { path = "../imsim-audio" }
glam = "0.32"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
half = "2.7"
# Gamepads (XInput / Windows.Gaming.Input / evdev) for controller support.
gilrs = "0.11"
cpal = "0.15"
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
# Ragdolls (skeletal.rs ragdoll): rigid bodies and joints.
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "parallel", "xpbd_joints"] }

[features]
# Chrome trace of every system, main and render world: cargo build --features trace (writes trace-*.json).
trace = ["bevy/trace_chrome"]
# Bevy's spans (every system, render graph node, submit, present) summed per frame into prof.log with DXVIEW_PROF=1.
spans = ["bevy/trace", "bevy/debug"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
raw-window-handle = "0.6"

# Bevy's features are per platform. Its "3d" and "ui" collections bring default_platform (winit, gilrs), which has
# no Switch backend, so the Switch build names the same features without it and bevy_horizon's HorizonPlugin
# stands in (src/horizon.rs). bevy stays in [dependencies] too: Bevy's derive macros look for it only there.
[target.'cfg(not(target_os = "horizon"))'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "ui", "experimental_pbr_pcss"] }

# Nintendo Switch: bevy-horizon checked out next to this repository; switch/build.sh builds the NRO.
[target.'cfg(target_os = "horizon")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    # "3d" and "ui" without default_platform
    "default_app", "3d_bevy_render", "ui_api", "ui_bevy_render", "bevy_ui_widgets", "scene", "picking",
    # the parts of default_platform that work on Horizon; bevy_gilrs only so main.rs can disable its plugin by name
    # (gilrs-core is patched for Horizon: switch/patches.toml)
    "std", "multi_threaded", "default_font", "bevy_gilrs",
    "experimental_pbr_pcss",
] }
bevy_horizon = { path = "../../../bevy-horizon/crates/bevy_horizon", features = ["vulkan", "render", "top_down_alloc"] }
