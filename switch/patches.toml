# The Switch build's crate patches beyond bevy-horizon's Bevy 0.19 set; switch/build.sh passes both to cargo.
# Paths are relative to this repository (cargo resolves a config file's paths from the parent of its folder),
# with bevy-horizon checked out next to it.
#
# A patch replaces only the crates.io version it's semver-compatible with, and only once Cargo.lock locks the
# patch's own version; switch/build.sh stops if the lock has moved away from one of these.

[patch.crates-io]
# imsim-audio and haptics.rs play through cpal 0.15, not the cpal 0.17 of Bevy 0.19's set: bevy-horizon's
# cpal 0.15.3 with its Horizon host on libnx's audio renderer (made for its Bevy 0.18 set).
cpal015 = { path = "../bevy-horizon/patches/bevy-0.18/cpal", package = "cpal" }
# gilrs-core 0.6.8 (gilrs 0.11) with a Horizon backend: libnx's default npad, and rumble on both of its
# vibration devices. Copied from the horizon port's third_party/gilrs-core; gamepad.rs reads the pad through it.
gilrs-core = { path = "switch/patches/gilrs-core" }
# hidapi 2.6.7, whose build script stops on an OS it has no backend for. This copy builds on Horizon and
# reports that there are no HID devices (src/horizon.rs); dualsense.rs then runs without a DualSense.
hidapi = { path = "switch/patches/hidapi" }
# bevy_pbr 0.19.1 with these changes for the Switch build, each marked "Patched" or "Switch build patch" in its source:
# - src/lightmap/mod.rs: entities whose lightmap is the same image share one slot. Without binding arrays, which the
#   Switch build turns off (horizon.rs), Bevy gave every lightmapped surface a slot of its own, and a bind group for
#   it in every phase, rebuilt every frame: run 11's profile spent 28% of both worker threads and 18% of the render
#   thread on them, though DX RUST's surfaces all share one lightmap atlas. Same picture; Bevy's lightmap docs advise
#   the atlas for exactly this.
# - src/prepass/mod.rs, src/render/mesh.rs: `SkipPrepass` leaves a mesh out of its views' depth prepass (horizon.rs
#   tags small props), and the previous transforms are kept only while a view draws motion vectors.
# - src/cluster/mod.rs, src/cluster/gpu.rs: GPU light clustering keeps each view's index list between frames instead
#   of uploading a new zeroed one every frame.
# - src/render/mesh.wgsl, src/material.rs: a mesh whose `MeshTag` carries `VIEW_MODEL_TAG_HIGH` (horizon.rs tags the
#   first-person weapon's) is projected as its own camera would project it, in front of everything, and its
#   transparent parts sort after everything else: the world camera draws the weapon, and the weapon's camera, a
#   second 3D camera with every per-view cost, stays off (viewcam.rs, behind Lean Rendering).
# - src/pbr_material.rs, src/render/pbr.wgsl: an unlit material gets pipelines of its own (`StandardMaterialKey::UNLIT`),
#   whose shaders leave Bevy's lighting out (`STANDARD_MATERIAL_UNLIT`; anim_frag.wgsl too). Upstream skips the
#   lighting at run time, so the picture is the same, but its code held every unlit mesh's shader at the lit one's 80
#   registers, and DX RUST's mesh actors are all unlit. `env DXVIEW_UNLIT_FULL=1` compiles them as upstream (an A/B switch).
bevy_pbr = { path = "switch/patches/bevy_pbr" }
# bevy_render 0.19.1 with this change for the Switch build, marked "Switch build patch" in its source:
# - src/renderer/render_context.rs: the render systems of a frame record into one command encoder instead of one each,
#   about 19 a frame on the title. Every encoder cost wgpu-core and the driver a command pool reset, resource trackers
#   sized to everything alive, a barrier buffer at submit and their teardown: about a quarter of run 15's render
#   thread on the title. The encoder sits outside the ECS (the main passes read the whole render world): a system
#   takes it at its first command and gives it back at the end of its run, and systems running at the same time take
#   turns; horizon.rs puts the camera schedules on one thread, which records them in the order upstream submits them.
#   `env DXVIEW_ENCODER_PER_PASS=1` gives each pass its own encoder again (an A/B switch).
bevy_render = { path = "switch/patches/bevy_render" }
